<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>root@heart-broken-bar:~#</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: #0d0e15; /* ดำมืดสนิทแบบร้านเหล้าปิดไฟ */
            color: #33ff33; /* เขียวเมทริกซ์ */
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        .ide-container {
            background: #11121b;
            width: 100%;
            max-width: 900px;
            border-radius: 12px;
            box-shadow: 0 25px 60px rgba(51, 255, 51, 0.1); /* เงาสีเขียวนีออนจางๆ */
            border: 1px solid #224422;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
        }

        .ide-header {
            background: #08090d;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #224422;
        }

        .ide-buttons {
            display: flex;
            gap: 8px;
            margin-right: 20px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        /* ปรับปุ่มให้เป็นโทนเขียวดำดุดัน */
        .dot-red { background: #224422; }
        .dot-yellow { background: #113311; }
        .dot-green { background: #33ff33; }

        .ide-title {
            color: #558855;
            font-size: 0.95rem;
        }

        .ide-body {
            padding: 3.5rem 2.5rem;
            text-align: center;
        }

        /* นาฬิกาสีเขียวนีออนสว่างวาบ */
        #time {
            font-size: 6.5rem;
            font-weight: bold;
            color: #33ff33;
            text-shadow: 0 0 25px rgba(51, 255, 51, 0.4);
            letter-spacing: 2px;
        }

        #date {
            font-size: 1.3rem;
            color: #aaccaa;
            margin-top: 5px;
            margin-bottom: 2rem;
        }

        /* โซนคำคมเหล้าและความรัก */
        .comment-line {
            color: #00ffaa; /* เขียวอมฟ้าเด่นๆ */
            font-style: italic;
            font-size: 1.3rem;
            margin: 2rem 0;
            min-height: 45px;
            font-weight: bold;
            line-height: 1.6;
        }

        .music-player {
            background: #161722;
            border: 1px solid #224422;
            border-radius: 8px;
            padding: 1.5rem;
            text-align: left;
            margin-top: 1rem;
        }

        .now-playing {
            background: #08090d;
            padding: 12px 15px;
            border-radius: 6px;
            border-left: 5px solid #33ff33;
            margin-bottom: 15px;
            overflow: hidden;
            white-space: nowrap;
        }

        .track-label {
            font-size: 0.8rem;
            color: #00ffaa;
            text-transform: uppercase;
            font-weight: bold;
            margin-bottom: 3px;
        }

        #track-title {
            font-size: 1rem;
            color: #33ff33;
            display: inline-block;
            animation: marquee 18s linear infinite;
            padding-left: 100%;
        }

        @keyframes marquee {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }

        .input-box {
            display: flex;
            gap: 12px;
            margin-bottom: 15px;
        }

        input[type="text"] {
            flex: 1;
            background: #08090d;
            border: 1px solid #224422;
            color: #33ff33;
            padding: 12px 18px;
            border-radius: 6px;
            outline: none;
            font-size: 0.95rem;
        }

        input[type="text"]::placeholder { color: #225522; }

        .btn {
            background: #224422;
            color: #33ff33;
            border: 1px solid #33ff33;
            padding: 12px 22px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.95rem;
            transition: all 0.2s;
        }

        .btn:hover {
            background: #33ff33;
            color: #000;
            box-shadow: 0 0 12px rgba(51, 255, 51, 0.6);
        }

        .btn-run { background: #33ff33; color: #000; }
        .btn-run:hover { background: #66ff66; }

        .controls { display: flex; gap: 12px; }
        
        .volume-box {
            margin-top: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #558855;
            font-size: 0.85rem;
        }
        
        input[type="range"] { flex: 1; accent-color: #33ff33; cursor: pointer; }

        #hidden-audio-player { position: absolute; width: 1px; height: 1px; opacity: 0; }
    </style>
</head>
<body>

    <div class="ide-container">
        <div class="ide-header">
            <div class="ide-buttons">
                <div class="dot dot-red"></div>
                <div class="dot dot-yellow"></div>
                <div class="dot dot-green"></div>
            </div>
            <div class="ide-title">drunk_logic.sh — Sad Server</div>
        </div>
        
        <div class="ide-body">
            <div id="time">00:00:00</div>
            <div id="date">$ date +"%Y-%m-%d"</div>

            <!-- ข้อความคำคมเหล้าและความรัก -->
            <div class="comment-line" id="troll-message"># Loading blood alcohol concentration vs memory data...</div>

            <div class="music-player">
                <div class="now-playing">
                    <div class="track-label">●เพลงขยี้คนอกหัก.mp3</div>
                    <div id="track-title">Loading sad jukebox...</div>
                </div>
                
                <div class="input-box">
                    <input type="text" id="audio-url" placeholder="วางลิงก์เพลงเพื่อชีวิต เพลงอกหัก หรือเพลงในร้านเหล้า...">
                    <button class="btn btn-run" onclick="loadAudio()">EXECUTE</button>
                </div>
                
                <div class="controls">
                    <button class="btn" onclick="controlAudio('playVideo')">./drink_play</button>
                    <button class="btn" onclick="controlAudio('pauseVideo')">./hold_glass</button>
                </div>
                
                <div class="volume-box">
                    <span>VOLUME</span>
                    <input type="range" min="0" max="100" value="50" oninput="setAudioVolume(this.value)">
                </div>
            </div>
        </div>
    </div>

    <div id="hidden-audio-player"></div>

    <script>
        function updateClock() {
            const now = new Date();
            let hours = String(now.getHours()).padStart(2, '0');
            let minutes = String(now.getMinutes()).padStart(2, '0');
            let seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('time').innerText = `${hours}:${minutes}:${seconds}`;

            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('date').innerText = `$ Bar Time: ${now.toLocaleDateString('th-TH', options)}`;

            if(!window.isCustomMessage) {
                updateDrunkMessage(now.getHours());
            }
        }

        // เซ็ตคำคมแนว ความรัก กับ เหล้า ในคราบโปรแกรมเมอร์ตามช่วงเวลา
        function updateDrunkMessage(hour) {
            let msg = "";
            if (hour >= 0 && hour < 5) msg = "“ตีสามกว่า... ล้าง Memory ด้วยเบียร์ไปกี่ขวด ทำไมยังลบชื่อเธอออกจาก Cache ไม่ได้สักที”";
            else if (hour >= 5 && hour < 8) msg = "“ร้านเหล้าปิดแต่ระบบคิดถึงยังรันอยู่... แอลกอฮอล์เต็มกระแสเลือด แต่ในใจดันเต็มไปด้วยเธอ”";
            else if (hour >= 8 && hour < 12) msg = "“เวลางานจิบกาแฟแก้แฮงค์... เหล้าเมื่อคืนทำลายตับ แต่ความรักของเธอทำลายหัวใจ”";
            else if (hour >= 12 && hour < 13) msg = "“พักเที่ยงกินข้าวไม่ลง... อยากซดเหล้าต้มกล้วยประชดรัก Error”";
            else if (hour >= 13 && hour < 17) msg = "“ช่วงบ่ายเหล้าเริ่มหมดฤทธิ์... ความเป็นจริงวิ่งเข้ามาทับซ้อน ว่าเธอนั้น Go Live กับคนอื่นไปแล้ว”";
            else if (hour >= 17 && hour < 20) msg = "“เลิกงานแล้ว... กดสวิตช์เปิดขวด ลืมเรื่อง Code ปวดหัว แล้วมาปวดใจกับเธอต่อ”";
            else msg = "“แก้วเหล้ายังมีวันหมด... แต่ความทรงจำประทับตรา (Hard Code) เรื่องเธอนั้น ไม่เคยลดลงเลย”";
            
            document.getElementById('troll-message').innerText = msg;
        }

        let audioPlayer;
        
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            audioPlayer = new YT.Player('hidden-audio-player', {
                height: '100', width: '100',
                videoId: 'TWxI2Ql3kdI',
                events: {
                    'onReady': (e) => { e.target.setVolume(50); updateAudioTrackName(); },
                    'onStateChange': () => updateAudioTrackName()
                }
            });
        }

        function updateAudioTrackName() {
            const titleElement = document.getElementById('track-title');
            if (audioPlayer && typeof audioPlayer.getVideoData === "function") {
                const videoData = audioPlayer.getVideoData();
                if (videoData && videoData.title) {
                    titleElement.innerText = `🍺 กำลังขับขาน: ${videoData.title} [โดย: ${videoData.author || 'Unknown'}]`;
                    return;
                }
            }
            titleElement.innerText = "Connecting to broken-heart radio...";
        }

        function extractVideoId(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function loadAudio() {
            const url = document.getElementById('audio-url').value;
            const id = extractVideoId(url);
            if (id) {
                audioPlayer.loadVideoById(id);
                document.getElementById('audio-url').value = '';
            } else {
                triggerTempMessage("❌ [500 Internal Server Error] ส่งลิงก์ผิด! นี่ยังไม่เมาใช่ไหม?");
            }
        }

        function controlAudio(action) {
            if (audioPlayer && typeof audioPlayer[action] === "function") audioPlayer[action]();
        }

        function setAudioVolume(val) {
            if (audioPlayer && typeof audioPlayer.setVolume === "function") audioPlayer.setVolume(val);
        }

        function triggerTempMessage(text) {
            window.isCustomMessage = true;
            document.getElementById('troll-message').innerText = text;
            setTimeout(() => { window.isCustomMessage = false; updateClock(); }, 4000);
        }

        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
